name: Backend quality

on:
  pull_request:
    paths: ['backend/**', '.agents/skills/**', 'scripts/test-trips.ps1', 'scripts/format-backend.py', '.github/workflows/backend.yml']
  push:
    branches: [dev, main, refactor/backend-quality]
    paths: ['backend/**', '.agents/skills/**', 'scripts/test-trips.ps1', 'scripts/format-backend.py', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: tripmate
          POSTGRES_PASSWORD: tripmate_ci_test
          POSTGRES_DB: tripmate_group_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U tripmate -d tripmate_group_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      profile-database:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tripmate_ci_test
          POSTGRES_DB: tripmate_profile_test
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tripmate_profile_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      GROUP_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55433/tripmate_group_test
      GROUP_TEST_DATABASE_PASSWORD: tripmate_ci_test
      SOCIAL_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55433/tripmate_social_test
      SOCIAL_TEST_DATABASE_PASSWORD: tripmate_ci_test
      MESSAGING_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55433/tripmate_messaging_test
      MESSAGING_TEST_DATABASE_PASSWORD: tripmate_ci_test
      PROFILE_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55434/tripmate_profile_test
      PROFILE_TEST_DATABASE_PASSWORD: tripmate_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Java formatting
        run: python scripts/format-backend.py --check
      - name: Create dedicated test databases
        run: |
          docker exec '${{ job.services.database.id }}' createdb -U tripmate tripmate_social_test
          docker exec '${{ job.services.database.id }}' createdb -U tripmate tripmate_messaging_test
      - name: Build and run PostgreSQL regression tests
        run: bash backend/mvnw -f backend/pom.xml --batch-mode verify
      - name: Reject skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'No backend test reports were produced'
          totals = {key: sum(int(ET.parse(p).getroot().get(key, '0')) for p in reports)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] > 0 and not any(totals[k] for k in ('failures', 'errors', 'skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/*.txt
