name: API contract
on:
  pull_request:
    paths: ['docs/api/**', '.github/workflows/api-contract.yml']
  push:
    branches: [main]
    paths: ['docs/api/**', '.github/workflows/api-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r docs/api/requirements.txt
      - run: python docs/api/validate_contract.py
      - run: node --test docs/api/mock-server.test.mjs
