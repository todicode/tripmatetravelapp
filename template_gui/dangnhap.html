<!DOCTYPE html><html class="h-full bg-slate-900" lang="vi"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>TripMate - Đăng nhập</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Inter', 'system-ui', 'sans-serif'],
              },
              colors: {
                rhyme: {
                  blue: '#2F80ED',
                  accent: '#3B82F6',
                  surface: '#F8F9FA',
                  card: 'rgba(255, 255, 255, 0.88)',
                  subtle: '#8E8E93',
                }
              },
              boxShadow: {
                'ios-glass': '0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6) inset',
                'ios-btn': '0 8px 18px -4px rgba(47, 128, 237, 0.35)',
                'ios-subtle': '0 2px 8px rgba(0, 0, 0, 0.04)',
              }
            }
          }
        }
    </script>
    <!-- Custom Styling for Apple Mockup & Visual Effects -->
    <style data-purpose="device-shell">
        /* Custom background simulated ambient map texture */
        .map-pattern {
          background-color: #F6F4EE;
          background-image: radial-gradient(#d3cbbe 0.75px, transparent 0.75px), radial-gradient(#d3cbbe 0.75px, #F6F4EE 0.75px);
          background-size: 30px 30px;
          background-position: 0 0, 15px 15px;
        }
        .frosted-glass {
          backdrop-filter: blur(28px);
          -webkit-backdrop-filter: blur(28px);
        }
        .custom-scrollbar::-webkit-scrollbar {
          display: none;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-0 md:p-6 bg-slate-900 font-sans antialiased text-slate-800 selection:bg-blue-100">
<!-- BEGIN: PhoneFrame -->
<div class="relative w-full max-w-[390px] min-h-[844px] h-[100dvh] md:h-[844px] bg-[#FAF9F5] rounded-[36px] shadow-2xl border-[6px] border-slate-900 overflow-hidden flex flex-col justify-between select-none" data-purpose="iphone-frame">
    <!-- BEGIN: AmbientBackground -->
    <!-- Soft warm scenic map artwork underlay matching Rome aesthetic from the original screen -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <!-- Abstract map routes & shapes -->
        <svg class="absolute -top-10 -left-10 w-[550px] h-[550px] opacity-40 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 400 400">
            <path d="M-20,120 C80,100 120,200 240,160 S380,260 420,220"></path>
            <path d="M50,-40 C140,80 180,100 220,280 S340,360 410,380" stroke-dasharray="6,6"></path>
            <circle cx="160" cy="180" r="90" stroke-width="1.5"></circle>
            <circle cx="280" cy="110" r="50" stroke-width="1.5"></circle>
        </svg>
        <!-- Colorful discovery pins simulating map locations -->
        <div class="absolute top-28 left-8 w-3 h-3 rounded-full bg-amber-500 ring-4 ring-amber-100/70"></div>
        <div class="absolute top-36 right-16 w-3.5 h-3.5 rounded-full bg-sky-500 ring-4 ring-sky-100/70"></div>
        <div class="absolute top-56 left-24 w-2.5 h-2.5 rounded-full bg-rose-400 ring-4 ring-rose-100/70"></div>
        <div class="absolute top-64 right-10 w-3 h-3 rounded-full bg-emerald-500 ring-4 ring-emerald-100/70"></div>
        <!-- Rome Label Watermark -->
        <span class="absolute top-44 left-1/2 -translate-x-1/2 text-5xl font-black text-stone-300/40 tracking-wider">TRIP</span>
        <!-- Ambient color blurs -->
        <div class="absolute -top-16 -right-16 w-72 h-72 rounded-full bg-sky-200/50 filter blur-3xl"></div>
        <div class="absolute top-40 -left-20 w-80 h-80 rounded-full bg-amber-100/60 filter blur-3xl"></div>
        <div class="absolute bottom-10 left-10 w-96 h-96 rounded-full bg-blue-100/40 filter blur-3xl"></div>
    </div>
    <!-- END: AmbientBackground -->
    <!-- BEGIN: iOSStatusBar -->
    <header class="relative z-30 h-9 px-5 flex items-center justify-between text-neutral-800 text-xs select-none"><span class="text-[13px] font-medium tracking-normal text-neutral-800">9:41</span><div class="absolute left-1/2 -translate-x-1/2 top-2 flex items-center justify-center"><div class="w-3.5 h-3.5 bg-black rounded-full ring-1 ring-neutral-800/40 shadow-inner"></div></div><div class="flex items-center space-x-1.5 text-neutral-800"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25a.75.75 0 0 0 .53 1.28h14.24a.75.75 0 0 0 .53-1.28l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.63-.56 3.13-1.5 4.33L16.2 15.03a5.5 5.5 0 0 0-8.4 0l-1.3 1.3A6.97 6.97 0 0 1 5 12c0-3.87 3.13-7 7-7zm0 4a3 3 0 0 1 2.6 1.5l-1.42 1.42a1 1 0 0 0-2.36 0L9.4 10.5A3 3 0 0 1 12 9z"></path></svg><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"></path></svg><div class="flex items-center space-x-1 ml-0.5"><span class="text-[11px] font-medium">85%</span><svg class="w-4 h-3.5 -rotate-90" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7v18h10V4z"></path></svg></div></div></header>
    <!-- END: iOSStatusBar -->
    <!-- BEGIN: BrandShowcase -->
    <section class="relative z-20 px-6 pt-5 pb-2 flex flex-col items-center text-center" data-purpose="branding-header">
        <!-- App Header Pill matching 'rhyme' signature icon style -->
        <div class="inline-flex items-center justify-center bg-white/90 frosted-glass shadow-[0_4px_16px_rgba(0,0,0,0.06)] px-5 py-2.5 rounded-full border border-white/80 mb-4 transition-transform active:scale-95 cursor-pointer">
<span class="text-2xl tracking-tight text-neutral-800 font-extrabold flex items-center space-x-1"><span class="">TripMate</span>
<span class="w-2 h-2 rounded-full bg-blue-500 inline-block mb-1"></span></span>
        </div>
        <!-- Social Proof Badge mirroring top-right of main UI (8 friends) -->

        <!-- Welcoming Title -->
        <h1 class="text-2xl font-bold tracking-tight text-neutral-900 leading-snug">
            Khám phá &amp; Lưu lại<br><span class="text-blue-600">địa điểm yêu thích</span>
        </h1>
        <p class="mt-1 text-xs text-neutral-500 font-medium max-w-[260px] leading-relaxed">
            Lên lịch trình, ghi dấu các quán cà phê, góc phố và chia sẻ ngay với nhóm bạn.
        </p>
    </section>
    <!-- END: BrandShowcase -->
    <!-- BEGIN: BottomSheetLoginCard -->
    <section class="relative z-20 bg-white/90 frosted-glass rounded-t-[36px] px-6 pt-5 pb-6 border-t border-white shadow-[0_-10px_35px_rgba(0,0,0,0.06)] flex flex-col justify-end" data-purpose="auth-bottom-sheet">
        <!-- iOS Drag Indicator Pill -->
        <div class="w-10 h-1 bg-neutral-300 rounded-full mx-auto mb-4"></div>
        <!-- Social Authentication Options -->
        <div class="space-y-2.5">
            <!-- Apple Sign-in Button -->

            <!-- Google Sign-in Button -->
            <button class="w-full h-11 bg-white hover:bg-neutral-50 active:scale-[0.98] text-neutral-800 text-sm font-semibold rounded-2xl flex items-center justify-center space-x-2.5 border border-neutral-200/90 shadow-sm transition-all duration-150" type="button">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
                    <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z" fill="#34A853"></path>
                    <path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
                    <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
                </svg>
                <span class="">Tiếp tục với Google</span>
            </button>
        </div>
        <!-- Divider -->
        <div class="relative my-3.5 flex items-center justify-center">
            <div class="border-t border-neutral-200 w-full"></div>
            <span class="bg-white/95 px-3 text-[11px] font-medium text-neutral-400 uppercase tracking-wider absolute">hoặc email</span>
        </div>
        <!-- Email Credentials Form -->
        <form class="space-y-2.5" onsubmit="event.preventDefault();">
            <!-- Input: Email / Username -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                    <!-- Mail Icon -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <input class="w-full h-11 pl-10 pr-4 text-xs font-medium bg-neutral-100/90 border border-transparent rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-neutral-400 text-neutral-800 outline-none" placeholder="Tên đăng nhập hoặc email" type="email" value="alex.traveler@gmail.com">
            </div>
            <!-- Input: Password -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                    <!-- Lock Icon -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <input class="w-full h-11 pl-10 pr-10 text-xs font-medium bg-neutral-100/90 border border-transparent rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-neutral-400 text-neutral-800 outline-none" placeholder="Mật khẩu" type="password" value="••••••••••••">
                <button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-600" type="button">
                    <!-- Eye icon -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
            </div>
            <!-- Forgot Password Link -->
            <div class="flex justify-end pt-0.5">
                <a class="text-[11.5px] font-semibold text-blue-600 hover:text-blue-700 active:underline" href="#">
                    Quên mật khẩu?
                </a>
            </div>
            <!-- Primary Action Button matching 'rhyme' blue theme -->
            <button class="w-full h-11 mt-1 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 active:scale-[0.98] text-white text-sm font-semibold rounded-2xl shadow-ios-btn flex items-center justify-center space-x-1.5 transition-all" type="submit">
                <span class="">Đăng nhập</span>
                <svg class="w-4 h-4 ml-0.5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
        </form>
        <!-- Bottom Register Link & Footer -->
        <div class="mt-4 text-center">
            <p class="text-xs text-neutral-500 font-medium">
                Chưa có tài khoản?
                <a class="text-blue-600 font-semibold hover:underline" href="#">Đăng ký ngay</a>
            </p>
        </div>
    </section>
    <!-- END: BottomSheetLoginCard -->
    <!-- BEGIN: iOSHomeIndicator -->
    <div class="relative z-30 py-1.5 flex justify-center items-center bg-white/90 frosted-glass"><div class="w-20 h-1 bg-slate-400/80 rounded-full mx-auto my-1"></div></div>
    <!-- END: iOSHomeIndicator -->
</div>
<!-- END: PhoneFrame -->








</body></html>
